<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LILA BLACK Journey Viewer</title>
    <script>
      // dark unless the viewer chose light (src/ui/theme.ts); runs before paint
      try {
        if (localStorage.getItem('lila-theme') !== 'light') document.documentElement.classList.add('dark')
      } catch {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
