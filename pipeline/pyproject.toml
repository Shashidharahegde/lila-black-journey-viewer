[project]
name = "lila-pipeline"
version = "0.1.0"
description = "Build-time data pipeline for the LILA BLACK player journey viewer"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lila_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
